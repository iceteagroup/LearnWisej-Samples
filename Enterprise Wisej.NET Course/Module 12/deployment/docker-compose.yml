# EnterpriseOps — sample two-node topology behind one reverse proxy.
#
# ⚠ A LAB DELIVERABLE, NOT A BUILD STEP. Nothing in this module runs `docker compose`.
#   Read it as the executable form of docs/DeploymentArchitecture.svg: proxy + two nodes + shared services.
#
# The point of the file is the four settings a session-aware application cannot live without:
#   1. sticky sessions at the proxy (see nginx.conf — ip_hash / a route cookie)
#   2. the WebSocket upgrade forwarded end to end
#   3. a readiness probe the proxy uses, and a liveness probe the runtime uses
#   4. every secret injected from the environment, never written into the image or this file

services:

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - app-node-a
      - app-node-b
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Long-lived WebSockets: the proxy's idle timeouts must exceed the Wisej.NET session timeout.

  app-node-a: &app-node
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: enterpriseops:2.4.2
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      EnterpriseOps__Release__NodeName: app-node-A
      # Secrets come from the shell / the platform's secret store — never from this file:
      EnterpriseOps__ConnectionString: ${ENTERPRISEOPS_CONNECTIONSTRING:?set it in the environment}
      EnterpriseOps__IdentityProvider__ClientSecret: ${ENTERPRISEOPS_IDP_SECRET:?set it in the environment}
    volumes:
      - uploads:/app/_storage          # uploads are shared, never node-local
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 120s            # drain: let pinned sessions finish instead of cutting them

  app-node-b:
    <<: *app-node
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      EnterpriseOps__Release__NodeName: app-node-B
      EnterpriseOps__ConnectionString: ${ENTERPRISEOPS_CONNECTIONSTRING:?set it in the environment}
      EnterpriseOps__IdentityProvider__ClientSecret: ${ENTERPRISEOPS_IDP_SECRET:?set it in the environment}

volumes:
  uploads:

# Rolling release, the compose form of runbook steps 3–8:
#   docker compose up -d --no-deps app-node-b        # one node at a time, never both
#   ...smoke tests + /healthz against node B...
#   docker compose up -d --no-deps app-node-a
# Rollback (step 8):
#   ENTERPRISEOPS_IMAGE=enterpriseops:2.4.1 docker compose up -d --no-deps app-node-b
#
# What compose CANNOT give you: a real balancer with health-aware routing. `nginx.conf` fakes it with
# ip_hash + max_fails; a production ingress (Azure App Service ARR affinity, AWS ALB target-group
# stickiness, an ingress controller with session affinity) does it properly.
