# EnterpriseOps — sample reverse-proxy configuration (NGINX).
#
# ⚠ A LAB DELIVERABLE, NOT A BUILD STEP. Nothing in this module starts NGINX.
#   Every line below exists because a Wisej.NET application keeps rich state in ONE node's memory and
#   talks to the browser over a long-lived WebSocket.

# The WebSocket upgrade must survive the proxy hop. This map keeps `Connection: upgrade` for the
# WebSocket handshake and `Connection: close` for ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream enterpriseops {
    # 1) SESSION AFFINITY — the reason this file exists.
    #    ip_hash pins a client to a node. It is the free version; a real balancer should use a route
    #    cookie (nginx-plus `sticky cookie EnterpriseOpsNode`, an ALB target-group stickiness rule, or
    #    Azure App Service ARR affinity), because ip_hash breaks behind a corporate NAT where hundreds
    #    of users share one address.
    ip_hash;

    # 2) HEALTH-AWARE ROUTING — after 3 failures inside 30 s the node is skipped for 30 s.
    #    Open-source NGINX only passively observes real traffic; `max_fails`/`fail_timeout` is the
    #    approximation. Active probing of /healthz is nginx-plus or a real load balancer.
    server app-node-a:8080 max_fails=3 fail_timeout=30s;
    server app-node-b:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name ops.enterpriseops.example;

    # TLS terminates here in production:
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/nginx/certs/enterpriseops.crt;
    #   ssl_certificate_key /etc/nginx/certs/enterpriseops.key;

    # Uploads: EnterpriseOps:UploadLimitMb is 25 in production — keep the proxy limit above it.
    client_max_body_size 32m;

    location / {
        proxy_pass http://enterpriseops;
        proxy_http_version 1.1;

        # 3) THE WEBSOCKET UPGRADE.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 4) THE REAL CLIENT, THE REAL SCHEME.
        #    Startup.cs calls UseForwardedHeaders, so the app sees https:// and the caller's address in
        #    the audit log instead of the proxy's. Without these two headers every audit line is wrong.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 5) LONG-LIVED CONNECTIONS.
        #    A Wisej.NET session's WebSocket is idle whenever the user is reading. These timeouts must
        #    exceed the session timeout, or the proxy kills the push channel and the app looks frozen.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # 6) NEVER BUFFER THE PUSH CHANNEL — buffering delays server-pushed updates.
        proxy_buffering off;
    }

    # 7) The readiness probe, reachable from the infrastructure and nowhere else.
    location = /healthz {
        proxy_pass http://enterpriseops;
        proxy_set_header Host $host;
        access_log off;
        allow 10.0.0.0/8;      # monitoring and the balancer only
        deny  all;
    }

    # 8) The configuration files are not static content. The application already refuses to serve them
    #    (Startup.cs skips every *.json); this is the second lock on the same door.
    location ~* \.(json|config)$ {
        deny all;
    }
}
