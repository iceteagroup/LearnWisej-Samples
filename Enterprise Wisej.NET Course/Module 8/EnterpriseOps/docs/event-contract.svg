<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>WorkOrderChartWidget — client/server event contract</title>

  <rect x="0" y="0" width="960" height="520" fill="#f4f7fb"/>

  <!-- server column -->
  <rect x="24" y="60" width="392" height="424" rx="10" fill="#ffffff" stroke="#c9d6e5"/>
  <text x="44" y="88" font-size="13" font-weight="700" fill="#1f2d3a" letter-spacing=".06em">SERVER · C#</text>

  <!-- client column -->
  <rect x="544" y="60" width="392" height="424" rx="10" fill="#ffffff" stroke="#c9d6e5"/>
  <text x="564" y="88" font-size="13" font-weight="700" fill="#1f2d3a" letter-spacing=".06em">BROWSER · JavaScript</text>

  <text x="24" y="34" font-size="18" font-weight="800" fill="#0d1b2a">WorkOrderChartWidget — the event contract 1.2.0</text>

  <!-- server boxes -->
  <rect x="44" y="104" width="352" height="62" rx="8" fill="#eef4ff" stroke="#9dbdf0"/>
  <text x="60" y="128" font-size="13" font-weight="700" fill="#12448f">WorkOrderHistoryPage</text>
  <text x="60" y="150" font-size="12" fill="#3c5470">SetSegments(...) · Palette · SegmentClicked · WidgetError</text>

  <rect x="44" y="186" width="352" height="86" rx="8" fill="#eef4ff" stroke="#9dbdf0"/>
  <text x="60" y="210" font-size="13" font-weight="700" fill="#12448f">WorkOrderChartWidget : Wisej.Web.Widget</text>
  <text x="60" y="232" font-size="12" fill="#3c5470">validates, owns Options / WiredEvents / Packages</text>
  <text x="60" y="252" font-size="12" fill="#3c5470">drops any key it did not render</text>

  <rect x="44" y="292" width="352" height="62" rx="8" fill="#f2f5f9" stroke="#c9d6e5"/>
  <text x="60" y="316" font-size="13" font-weight="700" fill="#3c5470">WorkOrderHistoryService · AccessPolicy</text>
  <text x="60" y="338" font-size="12" fill="#5a6b7d">StatusGroup.IsKnown(key) — validated a third time</text>

  <!-- client boxes -->
  <rect x="564" y="186" width="352" height="86" rx="8" fill="#fff6e8" stroke="#e8c08a"/>
  <text x="580" y="210" font-size="13" font-weight="700" fill="#8a5a10">opschart-init.js — the adapter (embedded)</text>
  <text x="580" y="232" font-size="12" fill="#7a6244">init / update / _addListener / _getEventData</text>
  <text x="580" y="252" font-size="12" fill="#7a6244">try/catch everywhere · owns the fallback</text>

  <rect x="564" y="292" width="352" height="62" rx="8" fill="#f2f5f9" stroke="#c9d6e5"/>
  <text x="580" y="316" font-size="13" font-weight="700" fill="#3c5470">EnterpriseOpsChart 1.2 — the vendor</text>
  <text x="580" y="338" font-size="12" fill="#5a6b7d">knows nothing about Wisej.NET or work orders</text>

  <!-- down arrow: options -->
  <line x1="400" y1="212" x2="556" y2="212" stroke="#1a86ff" stroke-width="2.5"/>
  <polygon points="556,212 546,207 546,217" fill="#1a86ff"/>
  <rect x="404" y="150" width="148" height="56" rx="7" fill="#e8f1ff" stroke="#9dbdf0"/>
  <text x="412" y="170" font-size="11.5" font-weight="700" fill="#12448f">Options ↓  update()</text>
  <text x="412" y="187" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#3c5470">segments[{key,label,value}]</text>
  <text x="412" y="200" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#3c5470">palette · caption · showLegend</text>

  <!-- up arrow: events -->
  <line x1="556" y1="256" x2="400" y2="256" stroke="#1f8a4c" stroke-width="2.5"/>
  <polygon points="400,256 410,251 410,261" fill="#1f8a4c"/>
  <rect x="404" y="262" width="148" height="56" rx="7" fill="#eaf7ef" stroke="#95cfae"/>
  <text x="412" y="282" font-size="11.5" font-weight="700" fill="#136b39">WiredEvents ↑</text>
  <text x="412" y="299" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#3c5470">pointSelected {key,…}</text>
  <text x="412" y="312" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#3c5470">error {phase,message}</text>

  <!-- vendor link -->
  <line x1="740" y1="276" x2="740" y2="288" stroke="#8a97a4" stroke-width="2"/>
  <polygon points="740,292 735,282 745,282" fill="#8a97a4"/>

  <!-- server link -->
  <line x1="220" y1="276" x2="220" y2="288" stroke="#8a97a4" stroke-width="2"/>
  <polygon points="220,292 215,282 225,282" fill="#8a97a4"/>
  <line x1="220" y1="170" x2="220" y2="182" stroke="#8a97a4" stroke-width="2"/>
  <polygon points="220,186 215,176 225,176" fill="#8a97a4"/>

  <!-- what never crosses -->
  <rect x="44" y="376" width="872" height="86" rx="8" fill="#fdecec" stroke="#e3a9a2"/>
  <text x="60" y="400" font-size="13" font-weight="700" fill="#a03528">What never crosses the wire</text>
  <text x="60" y="422" font-size="12" fill="#7c3a32">WorkOrder · TenantId · AssignedTo · Version · CorrelationId · the signed-in user · the actor of a history entry</text>
  <text x="60" y="444" font-size="12" fill="#7c3a32">The chart gets four objects of three fields: key, label, value. Nothing else is serialized into Options.</text>
</svg>
