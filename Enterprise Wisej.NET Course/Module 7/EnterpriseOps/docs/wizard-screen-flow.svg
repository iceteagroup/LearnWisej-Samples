<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a4d63"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a86ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#0d1b2a">EscalationWizard — screen flow</text>
  <text x="30" y="56" font-size="13" fill="#5a6b7d">Six pages collect into one EscalationWizardState · EscalationWorkflow owns every transition · the typed WorkflowResult decides what the screen shows next.</text>

  <!-- server-side draft store -->
  <rect x="60" y="78" width="1120" height="40" rx="8" fill="#f4f7fa" stroke="#c6d2de" stroke-dasharray="5 4"/>
  <text x="76" y="103" font-size="13" font-weight="600" fill="#46586a">WorkflowStateStore (server) — the state object is saved after every completed step: this is what survives a browser refresh, a cancel and a timeout</text>

  <!-- the six steps -->
  <g font-size="13">
    <g>
      <rect x="60" y="160" width="160" height="64" rx="9" fill="#eaf3ff" stroke="#1a86ff" stroke-width="1.5"/>
      <text x="140" y="185" font-size="12" font-weight="700" fill="#1a86ff" text-anchor="middle">STEP 1</text>
      <text x="140" y="205" font-weight="700" fill="#0d1b2a" text-anchor="middle">Reason</text>
      <text x="140" y="220" font-size="11" fill="#5a6b7d" text-anchor="middle">txtReason</text>
    </g>
    <g>
      <rect x="240" y="160" width="160" height="64" rx="9" fill="#f7fafd" stroke="#c6d2de" stroke-width="1.5"/>
      <text x="320" y="185" font-size="12" font-weight="700" fill="#8a97a4" text-anchor="middle">STEP 2</text>
      <text x="320" y="205" font-weight="700" fill="#0d1b2a" text-anchor="middle">Attachments</text>
      <text x="320" y="220" font-size="11" fill="#5a6b7d" text-anchor="middle">staged, not attached</text>
    </g>
    <g>
      <rect x="420" y="160" width="160" height="64" rx="9" fill="#f7fafd" stroke="#c6d2de" stroke-width="1.5"/>
      <text x="500" y="185" font-size="12" font-weight="700" fill="#8a97a4" text-anchor="middle">STEP 3</text>
      <text x="500" y="205" font-weight="700" fill="#0d1b2a" text-anchor="middle">Approver</text>
      <text x="500" y="220" font-size="11" fill="#5a6b7d" text-anchor="middle">external lookup · 5 s</text>
    </g>
    <g>
      <rect x="600" y="160" width="160" height="64" rx="9" fill="#f7fafd" stroke="#c6d2de" stroke-width="1.5"/>
      <text x="680" y="185" font-size="12" font-weight="700" fill="#8a97a4" text-anchor="middle">STEP 4</text>
      <text x="680" y="205" font-weight="700" fill="#0d1b2a" text-anchor="middle">Due date</text>
      <text x="680" y="220" font-size="11" fill="#5a6b7d" text-anchor="middle">dtpDueDate</text>
    </g>
    <g>
      <rect x="780" y="160" width="160" height="64" rx="9" fill="#f7fafd" stroke="#c6d2de" stroke-width="1.5"/>
      <text x="860" y="185" font-size="12" font-weight="700" fill="#8a97a4" text-anchor="middle">STEP 5</text>
      <text x="860" y="205" font-weight="700" fill="#0d1b2a" text-anchor="middle">Notifications</text>
      <text x="860" y="220" font-size="11" fill="#5a6b7d" text-anchor="middle">e-mail · in-app · SMS</text>
    </g>
    <g>
      <rect x="960" y="160" width="160" height="64" rx="9" fill="#f7fafd" stroke="#c6d2de" stroke-width="1.5"/>
      <text x="1040" y="185" font-size="12" font-weight="700" fill="#8a97a4" text-anchor="middle">STEP 6</text>
      <text x="1040" y="205" font-weight="700" fill="#0d1b2a" text-anchor="middle">Review</text>
      <text x="1040" y="220" font-size="11" fill="#5a6b7d" text-anchor="middle">dgvSummary</text>
    </g>
  </g>

  <!-- next arrows -->
  <g stroke="#3a4d63" stroke-width="1.6" marker-end="url(#arrow)" fill="none">
    <path d="M 222 192 L 236 192"/>
    <path d="M 402 192 L 416 192"/>
    <path d="M 582 192 L 596 192"/>
    <path d="M 762 192 L 776 192"/>
    <path d="M 942 192 L 956 192"/>
  </g>

  <!-- save arrows up to the store -->
  <g stroke="#8a97a4" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)" fill="none" opacity="0.85">
    <path d="M 140 158 L 140 120"/>
    <path d="M 320 158 L 320 120"/>
    <path d="M 500 158 L 500 120"/>
    <path d="M 680 158 L 680 120"/>
    <path d="M 860 158 L 860 120"/>
  </g>

  <!-- validation bar -->
  <rect x="60" y="244" width="1060" height="40" rx="8" fill="#fff8ec" stroke="#e8a13c"/>
  <text x="76" y="269" font-size="13" fill="#7a5210">Next → <tspan font-family="Consolas, monospace" font-weight="700">EscalationWorkflow.ValidateStep(state, step)</tspan> — invalid ⇒ stay on the step, show the FieldErrors next to the field, persist nothing. Back never validates.</text>

  <!-- finish arrow -->
  <path d="M 1040 226 L 1040 300 L 900 300" stroke="#1a86ff" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1052" y="266" font-size="13" font-weight="700" fill="#1a86ff">Finish</text>

  <!-- orchestration -->
  <rect x="180" y="310" width="720" height="120" rx="12" fill="#f2f7ff" stroke="#1a86ff" stroke-width="1.6"/>
  <text x="200" y="337" font-size="14" font-weight="700" fill="#0d1b2a" font-family="Consolas, monospace">EscalationWorkflow.EscalateAsync(EscalationCommand) → WorkflowResult</text>
  <text x="200" y="356" font-size="12" fill="#5a6b7d">one owner for the whole transition — not five page events</text>
  <g font-family="Consolas, monospace" font-size="12.5">
    <rect x="200" y="372" width="126" height="40" rx="20" fill="#ffffff" stroke="#1f8a4c"/>
    <text x="263" y="397" fill="#1f8a4c" text-anchor="middle">validate</text>
    <rect x="336" y="372" width="126" height="40" rx="20" fill="#ffffff" stroke="#1f8a4c"/>
    <text x="399" y="397" fill="#1f8a4c" text-anchor="middle">authorize</text>
    <rect x="472" y="372" width="126" height="40" rx="20" fill="#ffffff" stroke="#1f8a4c"/>
    <text x="535" y="397" fill="#1f8a4c" text-anchor="middle">persist</text>
    <rect x="608" y="372" width="126" height="40" rx="20" fill="#fff4f2" stroke="#c0392b"/>
    <text x="671" y="397" fill="#c0392b" text-anchor="middle">notify ⚡</text>
    <rect x="744" y="372" width="136" height="40" rx="20" fill="#ffffff" stroke="#1f8a4c"/>
    <text x="812" y="397" fill="#1f8a4c" text-anchor="middle">audit</text>
  </g>
  <g stroke="#3a4d63" stroke-width="1.4" marker-end="url(#arrow)" fill="none">
    <path d="M 328 392 L 334 392"/>
    <path d="M 464 392 L 470 392"/>
    <path d="M 600 392 L 606 392"/>
    <path d="M 736 392 L 742 392"/>
  </g>
  <text x="908" y="392" font-size="12" fill="#c0392b">⚡ external —</text>
  <text x="908" y="408" font-size="12" fill="#c0392b">outside every transaction</text>

  <!-- outcomes -->
  <g font-size="12.5">
    <rect x="60" y="470" width="255" height="96" rx="10" fill="#f0f9f3" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="76" y="494" font-size="13" font-weight="700" fill="#155f33" font-family="Consolas, monospace">Created</text>
    <text x="76" y="516" fill="#2e7d4f">every step succeeded</text>
    <text x="76" y="534" fill="#2e7d4f">wizard: green banner, Close</text>
    <text x="76" y="552" fill="#2e7d4f">draft removed, audit written</text>

    <rect x="335" y="470" width="255" height="96" rx="10" fill="#fff8ec" stroke="#e8a13c" stroke-width="1.5"/>
    <text x="351" y="494" font-size="13" font-weight="700" fill="#7a5210" font-family="Consolas, monospace">CreatedWithCompensation</text>
    <text x="351" y="516" fill="#9a7a3a">escalation KEPT · notify ✕</text>
    <text x="351" y="534" fill="#9a7a3a">CompensationAction recorded</text>
    <text x="351" y="552" fill="#9a7a3a">→ manual-review queue</text>

    <rect x="610" y="470" width="255" height="96" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="626" y="494" font-size="13" font-weight="700" fill="#9a2a18" font-family="Consolas, monospace">ValidationFailed</text>
    <text x="626" y="516" fill="#b44632">nothing persisted</text>
    <text x="626" y="534" fill="#b44632">FieldError(Step, Field, Message)</text>
    <text x="626" y="552" fill="#b44632">wizard jumps to the failing step</text>

    <rect x="885" y="470" width="255" height="96" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="901" y="494" font-size="13" font-weight="700" fill="#9a2a18" font-family="Consolas, monospace">Unauthorized · Failed</text>
    <text x="901" y="516" fill="#b44632">nothing persisted</text>
    <text x="901" y="534" fill="#b44632">persist reverted where possible</text>
    <text x="901" y="552" fill="#b44632">safe message + correlation id</text>
  </g>
  <g stroke="#3a4d63" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M 400 432 L 300 468"/>
    <path d="M 500 432 L 480 468"/>
    <path d="M 620 432 L 700 468"/>
    <path d="M 760 432 L 960 468"/>
  </g>
  <!-- validation failure jumps back into the wizard -->
  <path d="M 737 470 L 737 452 L 1180 452 L 1180 192 L 1124 192" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="1186" y="330" font-size="12" font-weight="700" fill="#c0392b" transform="rotate(-90 1186 330)">result.FirstFailingStep → jump back</text>

  <!-- cancel / compensation lane -->
  <rect x="60" y="600" width="520" height="120" rx="10" fill="#f7fafd" stroke="#c6d2de"/>
  <text x="76" y="624" font-size="13" font-weight="700" fill="#0d1b2a">Cancel (any step)</text>
  <text x="76" y="646" font-size="12.5" fill="#46586a">Keep draft → WorkflowStateStore.Save · the next open resumes at the same step</text>
  <text x="76" y="666" font-size="12.5" fill="#46586a">Discard → draft removed + AttachmentStaging.DiscardAll (uploads cleaned up)</text>
  <text x="76" y="690" font-size="12.5" fill="#46586a">Timeout (approver lookup) → the draft is untouched; nothing half-applied</text>
  <text x="76" y="710" font-size="12" fill="#8a97a4" font-style="italic">Nothing is persisted on either path — the workflow was never called.</text>

  <rect x="620" y="600" width="520" height="120" rx="10" fill="#fff8ec" stroke="#e8a13c"/>
  <text x="636" y="624" font-size="13" font-weight="700" fill="#7a5210">Manual-review queue (CompensationLog)</text>
  <text x="636" y="646" font-size="12.5" fill="#9a7a3a">NotificationOutstanding → Retry notification → RetryNotificationAsync → resolved</text>
  <text x="636" y="666" font-size="12.5" fill="#9a7a3a">AuditGap → cannot be retried (the notification is out) → resolved manually + alert</text>
  <text x="636" y="686" font-size="12.5" fill="#9a7a3a">RevertedPersist → the work order was put back; nothing to follow up</text>
  <text x="636" y="710" font-size="12" fill="#b9770e" font-style="italic">The workflow finishes later — with the audit trail intact.</text>
</svg>
