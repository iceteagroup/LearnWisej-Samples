<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="660" fill="#eef2f7"/>

  <text x="32" y="42" font-size="21" font-weight="700" fill="#0d1b2a">EnterpriseOps — solution structure (ADR-001)</text>
  <text x="32" y="66" font-size="13" fill="#5a6b7d">One web project · folder-per-layer · namespaces follow folders. Arrows point the only direction a reference may go.</text>

  <!-- UI layer -->
  <rect x="32" y="92" width="600" height="96" rx="10" fill="#ffffff" stroke="#1565d8" stroke-width="2"/>
  <text x="48" y="118" font-size="15" font-weight="700" fill="#1565d8">EnterpriseOps.UI</text>
  <text x="48" y="140" font-size="12.5" fill="#46586a">CommandCenterDashboard.cs + .Designer.cs — layout, tiles, grid, banner, status bar.</text>
  <text x="48" y="160" font-size="12.5" fill="#46586a">UI state only. Every handler: try { await _workflow.XAsync(ctx); ShowResult(r); } catch { log; generic }</text>
  <text x="48" y="180" font-size="12" fill="#7a8a99" font-style="italic">Stays designable — the Designer never loads a repository or an integration.</text>

  <rect x="652" y="92" width="296" height="96" rx="10" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5"/>
  <text x="668" y="118" font-size="15" font-weight="700" fill="#3a4d63">EnterpriseOps.Controls</text>
  <text x="668" y="140" font-size="12.5" fill="#46586a">KpiTile — shared, designable.</text>
  <text x="668" y="160" font-size="12.5" fill="#46586a">Shows a number.</text>
  <text x="668" y="180" font-size="12" fill="#7a8a99" font-style="italic">Never computes one.</text>

  <!-- arrow UI -> Services -->
  <path d="M332 188 L332 222" stroke="#1565d8" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="342" y="212" font-size="12" fill="#1565d8">one workflow per screen</text>

  <!-- Services layer -->
  <rect x="32" y="228" width="916" height="112" rx="10" fill="#ffffff" stroke="#1f8a4c" stroke-width="2.4"/>
  <text x="48" y="254" font-size="15" font-weight="700" fill="#1f8a4c">EnterpriseOps.Services  ·  Services/Workflow</text>
  <text x="48" y="276" font-size="12.5" fill="#46586a">DashboardWorkflow.LoadAsync / RefreshAsync — the only place a decision is taken, in this order:</text>
  <rect x="48" y="288" width="196" height="36" rx="7" fill="#f1f5fa" stroke="#c6d2de"/>
  <text x="60" y="311" font-size="12.5" font-weight="600" fill="#3a4d63">1 · Security policy</text>
  <rect x="256" y="288" width="196" height="36" rx="7" fill="#f1f5fa" stroke="#c6d2de"/>
  <text x="268" y="311" font-size="12.5" font-weight="600" fill="#3a4d63">2 · Integration pull</text>
  <rect x="464" y="288" width="196" height="36" rx="7" fill="#f1f5fa" stroke="#c6d2de"/>
  <text x="476" y="311" font-size="12.5" font-weight="600" fill="#3a4d63">3 · Data query</text>
  <rect x="672" y="288" width="260" height="36" rx="7" fill="#f1f5fa" stroke="#c6d2de"/>
  <text x="684" y="311" font-size="12.5" font-weight="600" fill="#3a4d63">4 · KPIs + row projection</text>

  <!-- arrows down -->
  <path d="M146 340 L146 386" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M354 340 L354 386" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M562 340 L562 386" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M802 340 L802 386" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- infrastructure row -->
  <rect x="32" y="392" width="228" height="92" rx="10" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5"/>
  <text x="48" y="416" font-size="14" font-weight="700" fill="#3a4d63">Security</text>
  <text x="48" y="438" font-size="12" fill="#46586a">UserIdentity · UserRole</text>
  <text x="48" y="456" font-size="12" fill="#46586a">DashboardPolicy</text>
  <text x="48" y="474" font-size="11.5" fill="#7a8a99">decides first</text>

  <rect x="272" y="392" width="228" height="92" rx="10" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5"/>
  <text x="288" y="416" font-size="14" font-weight="700" fill="#3a4d63">Integrations</text>
  <text x="288" y="438" font-size="12" fill="#46586a">OperationsFeed</text>
  <text x="288" y="456" font-size="12" fill="#46586a">ReleaseCalendar</text>
  <text x="288" y="474" font-size="11.5" fill="#7a8a99">behind fakes</text>

  <rect x="512" y="392" width="228" height="92" rx="10" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5"/>
  <text x="528" y="416" font-size="14" font-weight="700" fill="#3a4d63">Data</text>
  <text x="528" y="438" font-size="12" fill="#46586a">IWorkOrderRepository</text>
  <text x="528" y="456" font-size="12" fill="#46586a">InMemoryWorkOrderRepository</text>
  <text x="528" y="474" font-size="11.5" fill="#7a8a99">EF Core swaps in — Module 4</text>

  <rect x="752" y="392" width="196" height="92" rx="10" fill="#ffffff" stroke="#8aa0b8" stroke-width="1.5"/>
  <text x="768" y="416" font-size="14" font-weight="700" fill="#3a4d63">Resources</text>
  <text x="768" y="438" font-size="12" fill="#46586a">UiText</text>
  <text x="768" y="456" font-size="12" fill="#46586a">what the user reads</text>
  <text x="768" y="474" font-size="11.5" fill="#7a8a99">never an exception</text>

  <!-- Domain -->
  <path d="M146 484 L146 512" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M386 484 L386 512" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M626 484 L626 512" stroke="#8aa0b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="32" y="518" width="708" height="66" rx="10" fill="#ffffff" stroke="#0d1b2a" stroke-width="2"/>
  <text x="48" y="542" font-size="15" font-weight="700" fill="#0d1b2a">EnterpriseOps.Domain</text>
  <text x="48" y="566" font-size="12.5" fill="#46586a">WorkOrder · WorkOrderStatus · Priority · Tenant — the vocabulary all 14 modules share. References nothing.</text>

  <!-- cross-cutting -->
  <rect x="752" y="518" width="196" height="66" rx="10" fill="#0f2440"/>
  <text x="768" y="542" font-size="14" font-weight="700" fill="#9fc0e8">Diagnostics</text>
  <text x="768" y="564" font-size="12" fill="#9fc0e8">ActivityTrace · ErrorLog</text>
  <path d="M850 518 L850 344" stroke="#9fc0e8" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>

  <rect x="32" y="600" width="916" height="40" rx="10" fill="#ffffff" stroke="#e8a13c" stroke-width="2"/>
  <text x="48" y="626" font-size="13" fill="#8a5a12"><tspan font-weight="700">Architecture/</tspan> — ADR-001 · ArchitectureGovernancePatterns (ReviewGate) · Samples/OrderEntryLegacy.cs.txt (74 lines, 0 service calls → blocked)</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8aa0b8"/>
    </marker>
  </defs>
</svg>
