<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>EnterpriseOps Command Center — the capstone and the package that ships with it</title>
  <desc>One browser session holds a SessionContext and its services. A command crosses UI, Services, Security and Data, writing an audit line and a trace line at each step. The capstone package — prompt library, review checklist, documentation index, demo script, defense deck and readiness statement — ships with the application and is verified by it.</desc>

  <rect x="0" y="0" width="1180" height="700" fill="#eef2f7"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0d1b2a">EnterpriseOps Command Center — the capstone</text>
  <text x="40" y="72" font-size="14" fill="#5a6b7d">One session, one command path, one package that proves the system rather than the screens.</text>

  <!-- session boundary -->
  <rect x="40" y="96" width="700" height="404" rx="12" fill="#ffffff" stroke="#c7d4e3" stroke-width="1.5"/>
  <text x="60" y="124" font-size="13" font-weight="700" fill="#1565d8" letter-spacing="1">ONE BROWSER SESSION · SessionContext in Application.Session · nothing static</text>

  <!-- UI layer -->
  <rect x="64" y="140" width="652" height="78" rx="9" fill="#f4f7fb" stroke="#1565d8" stroke-width="1.5"/>
  <text x="82" y="164" font-size="14" font-weight="700" fill="#0d1b2a">UI &#8594;</text>
  <text x="82" y="186" font-size="13" fill="#3a4d63">CommandCenterDashboard · CapstoneReviewPage · KpiTile</text>
  <text x="82" y="206" font-size="12" fill="#7a8b9c">thin handlers: ask, show the result, never decide</text>

  <!-- Services layer -->
  <rect x="64" y="234" width="652" height="86" rx="9" fill="#f4f7fb" stroke="#1565d8" stroke-width="1.5"/>
  <text x="82" y="258" font-size="14" font-weight="700" fill="#0d1b2a">Service:</text>
  <text x="82" y="280" font-size="13" fill="#3a4d63">DashboardService · WorkOrderService · DiagnosticsService</text>
  <text x="82" y="298" font-size="13" fill="#3a4d63">CapstonePackageService · GeneratedCodeReviewService · DocumentationIndexService</text>
  <text x="82" y="314" font-size="12" fill="#7a8b9c">typed commands in, typed results out — testable without a browser</text>

  <!-- Security layer -->
  <rect x="64" y="336" width="318" height="72" rx="9" fill="#fdf4ef" stroke="#e8a13c" stroke-width="1.5"/>
  <text x="82" y="360" font-size="14" font-weight="700" fill="#0d1b2a">Security:</text>
  <text x="82" y="380" font-size="13" fill="#3a4d63">PermissionService · AuditLog</text>
  <text x="82" y="398" font-size="12" fill="#7a8b9c">checked before the read; denials audited too</text>

  <!-- Data layer -->
  <rect x="398" y="336" width="318" height="72" rx="9" fill="#f1f8f3" stroke="#1f9d57" stroke-width="1.5"/>
  <text x="416" y="360" font-size="14" font-weight="700" fill="#0d1b2a">Data:</text>
  <text x="416" y="380" font-size="13" fill="#3a4d63">InMemoryWorkOrderStore · DocsFolder</text>
  <text x="416" y="398" font-size="12" fill="#7a8b9c">tenant-scoped queries · optimistic version</text>

  <!-- trace -->
  <rect x="64" y="424" width="652" height="56" rx="9" fill="#0f2440"/>
  <text x="82" y="448" font-size="13" font-weight="700" fill="#9fc0e8">Diagnostics: ActivityTrace</text>
  <text x="82" y="468" font-size="12" fill="#7fb6ff" font-family="Consolas, monospace">UI &#8594; · Security: · Service: · Data: · Job: · Review: · Docs: — one line per decision</text>

  <!-- arrows down the layers -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565d8"/>
    </marker>
  </defs>
  <line x1="390" y1="218" x2="390" y2="232" stroke="#1565d8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="223" y1="320" x2="223" y2="334" stroke="#1565d8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="557" y1="320" x2="557" y2="334" stroke="#1565d8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the package -->
  <rect x="772" y="96" width="368" height="404" rx="12" fill="#ffffff" stroke="#1f9d57" stroke-width="1.5"/>
  <text x="792" y="124" font-size="13" font-weight="700" fill="#1f9d57" letter-spacing="1">THE CAPSTONE PACKAGE · docs/</text>

  <g font-size="13" fill="#0d1b2a">
    <rect x="792" y="140" width="328" height="46" rx="7" fill="#f1f8f3" stroke="#c3e2cf"/>
    <text x="808" y="160" font-weight="600">AI prompt library</text>
    <text x="808" y="178" font-size="11.5" fill="#7a8b9c">PromptLibrary.md — the header, then the task</text>

    <rect x="792" y="194" width="328" height="46" rx="7" fill="#f1f8f3" stroke="#c3e2cf"/>
    <text x="808" y="214" font-weight="600">Generated-code review checklist</text>
    <text x="808" y="232" font-size="11.5" fill="#7a8b9c">GeneratedCodeReviewChecklist.md — Q1–Q6, R7–R10</text>

    <rect x="792" y="248" width="328" height="46" rx="7" fill="#f1f8f3" stroke="#c3e2cf"/>
    <text x="808" y="268" font-weight="600">Project documentation index</text>
    <text x="808" y="286" font-size="11.5" fill="#7a8b9c">DocumentationIndex.md + index.json (MCP-ready)</text>

    <rect x="792" y="302" width="328" height="46" rx="7" fill="#f1f8f3" stroke="#c3e2cf"/>
    <text x="808" y="322" font-weight="600">Capstone demo script</text>
    <text x="808" y="340" font-size="11.5" fill="#7a8b9c">CapstoneDemoScript.md — seven stops, failure paths included</text>

    <rect x="792" y="356" width="328" height="46" rx="7" fill="#f1f8f3" stroke="#c3e2cf"/>
    <text x="808" y="376" font-weight="600">Architecture defense deck outline</text>
    <text x="808" y="394" font-size="11.5" fill="#7a8b9c">DefenseDeckOutline.md — claim · evidence · risk</text>

    <rect x="792" y="410" width="328" height="46" rx="7" fill="#f1f8f3" stroke="#c3e2cf"/>
    <text x="808" y="430" font-weight="600">Production readiness statement</text>
    <text x="808" y="448" font-size="11.5" fill="#7a8b9c">ProductionReadiness.md — ready, open items, sign-off</text>
  </g>

  <text x="792" y="482" font-size="11.5" fill="#7a8b9c">AIAssistedReviewPatterns.md · AIUsageNotes.md · this diagram</text>

  <!-- the app verifies the package -->
  <path d="M716 372 C 744 372, 744 300, 770 300" fill="none" stroke="#1f9d57" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="772" cy="300" r="4" fill="#1f9d57"/>
  <text x="588" y="502" font-size="12" fill="#1f9d57" font-weight="600">CapstonePackageService verifies every deliverable &#8594;</text>

  <!-- the review gate -->
  <rect x="40" y="524" width="1100" height="140" rx="12" fill="#ffffff" stroke="#c7d4e3" stroke-width="1.5"/>
  <text x="60" y="552" font-size="13" font-weight="700" fill="#c0392b" letter-spacing="1">THE GATE · generated code is a draft from an unknown contributor</text>

  <rect x="60" y="566" width="240" height="76" rx="8" fill="#fdf0ec" stroke="#e0563b"/>
  <text x="76" y="590" font-size="13" font-weight="600" fill="#0d1b2a">AI draft · PR #214</text>
  <text x="76" y="610" font-size="11.5" fill="#7a8b9c">compiles · the screen looks right</text>
  <text x="76" y="628" font-size="11.5" fill="#c0392b">static state · invented APIs</text>

  <line x1="308" y1="604" x2="352" y2="604" stroke="#1565d8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="566" width="300" height="76" rx="8" fill="#f4f7fb" stroke="#1565d8"/>
  <text x="376" y="590" font-size="13" font-weight="600" fill="#0d1b2a">GeneratedCodeReviewService</text>
  <text x="376" y="610" font-size="11.5" fill="#7a8b9c">10 rules · 3752 documented members</text>
  <text x="376" y="628" font-size="11.5" fill="#7a8b9c">catalog from Wisej.Framework.xml</text>

  <line x1="668" y1="604" x2="712" y2="604" stroke="#1565d8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="566" width="200" height="76" rx="8" fill="#fdf0ec" stroke="#e0563b"/>
  <text x="736" y="590" font-size="13" font-weight="600" fill="#c0392b">REJECTED</text>
  <text x="736" y="610" font-size="11.5" fill="#7a8b9c">11 findings, 9 blocking</text>
  <text x="736" y="628" font-size="11.5" fill="#7a8b9c">sent back with the header</text>

  <line x1="928" y1="604" x2="952" y2="604" stroke="#1f9d57" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="960" y="566" width="160" height="76" rx="8" fill="#f1f8f3" stroke="#1f9d57"/>
  <text x="976" y="590" font-size="13" font-weight="600" fill="#1f9d57">rev 2 ACCEPTED</text>
  <text x="976" y="610" font-size="11.5" fill="#7a8b9c">instance service</text>
  <text x="976" y="628" font-size="11.5" fill="#7a8b9c">documented APIs, cited</text>
</svg>
