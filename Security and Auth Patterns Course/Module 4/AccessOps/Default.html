<!DOCTYPE html>
<html>
<head>
    <title>AccessOps</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <script>
        // The page functions the server calls with Application.Call / Application.CallAsync. Values
        // arrive as arguments - never concatenated into script. Every POST carries a fresh
        // antiforgery token from /auth/antiforgery (same origin only: there is no CORS).
        (function () {
            var endedWords = ["signout"];

            function token() {
                return fetch("auth/antiforgery", { credentials: "same-origin", cache: "no-store" })
                    .then(function (r) { return r.json(); })
                    .then(function (j) { return j.token; });
            }

            function post(path, body) {
                return token().then(function (t) {
                    return fetch(path, {
                        method: "POST",
                        credentials: "same-origin",
                        cache: "no-store",
                        headers: { "Content-Type": "application/json", "RequestVerificationToken": t },
                        body: JSON.stringify(body || {})
                    });
                }).then(function (r) { return r.status; }, function () { return 0; });
            }

            window.AccessOpsAuth = {
                // after the page load that established the principal: the host cookie, over HTTPS
                issueCookie: function (handle) { return post("auth/cookie", { handle: String(handle) }); },
                // sign-out: remember why the session ends, then expire the host cookie
                signOut: function (word) {
                    if (endedWords.indexOf(word) >= 0)
                        sessionStorage.setItem("AccessOps.Ended", word);
                    return post("auth/signout", {});
                }
            };

            // After Application.Exit() the tab reloads into a new session: tell it why.
            var ended = sessionStorage.getItem("AccessOps.Ended");
            if (endedWords.indexOf(ended) >= 0) {
                sessionStorage.removeItem("AccessOps.Ended");
                history.replaceState(null, "", "Default.html?ended=" + ended);
            }
        })();
    </script>
    <script src="wisej.wx"></script>
</head>
<body>

</body>
</html>
