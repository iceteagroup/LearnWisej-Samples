<!DOCTYPE html>
<html>
<head>
    <title>AccessOps</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <script>
        // The page functions the server calls with Application.Call / Application.CallAsync. Values
        // arrive as arguments - never concatenated into script. Every POST carries a fresh
        // antiforgery token from /auth/antiforgery (same origin only: there is no CORS).
        (function () {
            var endedWords = ["signout", "signout-external"];

            function token() {
                return fetch("auth/antiforgery", { credentials: "same-origin", cache: "no-store" })
                    .then(function (r) { return r.json(); })
                    .then(function (j) { return j.token; });
            }

            function post(path, body) {
                return token().then(function (t) {
                    return fetch(path, {
                        method: "POST",
                        credentials: "same-origin",
                        cache: "no-store",
                        headers: { "Content-Type": "application/json", "RequestVerificationToken": t },
                        body: JSON.stringify(body || {})
                    });
                }).then(function (r) { return r.status; }, function () { return 0; });
            }

            window.AccessOpsAuth = {
                // after the page load that established the principal: the host cookie, over HTTPS
                issueCookie: function (handle) { return post("auth/cookie", { handle: String(handle) }); },
                // sign-out: remember why the session ends, expire the host cookie, and for a
                // federated sign-in keep a fresh (now anonymous) token for the provider sign-out post
                signOut: function (word) {
                    if (endedWords.indexOf(word) < 0)
                        return 0;
                    sessionStorage.setItem("AccessOps.Ended", word);
                    return post("auth/signout", {}).then(function (status) {
                        if (word !== "signout-external")
                            return status;
                        return token().then(function (t) {
                            sessionStorage.setItem("AccessOps.SignOutToken", t);
                            return status;
                        });
                    });
                }
            };

            // After Application.Exit() the tab reloads into a new session: tell it why. A federated
            // sign-out first posts to /account/signout, which ends the provider's session and comes
            // back to Default.html?ended=signout. In that case the Wisej.NET client is not loaded.
            var ended = sessionStorage.getItem("AccessOps.Ended");
            var signOutToken = sessionStorage.getItem("AccessOps.SignOutToken");
            sessionStorage.removeItem("AccessOps.Ended");
            sessionStorage.removeItem("AccessOps.SignOutToken");
            window.AccessOpsLeaving = false;
            if (ended === "signout-external" && signOutToken) {
                window.AccessOpsLeaving = true;
                document.write('<form id="accessOpsSignOut" method="post" action="account/signout"><input type="hidden" name="__RequestVerificationToken" /></form>');
                var form = document.getElementById("accessOpsSignOut");
                form.elements[0].value = signOutToken;   // a DOM value, not markup
                form.submit();
            }
            else if (endedWords.indexOf(ended) >= 0) {
                history.replaceState(null, "", "Default.html?ended=signout");
            }
        })();
        if (!window.AccessOpsLeaving)
            document.write('<script src="wisej.wx"><\/script>');
    </script>
</head>
<body>

</body>
</html>
