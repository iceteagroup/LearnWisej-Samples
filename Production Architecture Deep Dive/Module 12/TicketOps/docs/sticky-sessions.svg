<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="440" fill="#f6f9fc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0d1b2a">Sticky sessions: each user is pinned to the node that holds their Wisej.NET session</text>

  <!-- users -->
  <g>
    <rect x="30" y="120" width="190" height="70" rx="10" fill="#fff" stroke="#1fae5a" stroke-width="2"/>
    <circle cx="65" cy="155" r="18" fill="#e6f7ec" stroke="#1fae5a" stroke-width="2"/>
    <text x="65" y="160" font-size="13" font-weight="700" fill="#1fae5a" text-anchor="middle">LR</text>
    <text x="95" y="150" font-size="16" font-weight="700" fill="#0d1b2a">L. Romero</text>
    <text x="95" y="172" font-size="12" fill="#5a6b7d">browser · cookie: node A</text>

    <rect x="30" y="270" width="190" height="70" rx="10" fill="#fff" stroke="#7d5ae0" stroke-width="2"/>
    <circle cx="65" cy="305" r="18" fill="#efeafc" stroke="#7d5ae0" stroke-width="2"/>
    <text x="65" y="310" font-size="13" font-weight="700" fill="#7d5ae0" text-anchor="middle">MW</text>
    <text x="95" y="300" font-size="16" font-weight="700" fill="#0d1b2a">M. Weber</text>
    <text x="95" y="322" font-size="12" fill="#5a6b7d">browser · cookie: node B</text>
  </g>

  <!-- load balancer -->
  <g>
    <rect x="400" y="170" width="280" height="120" rx="12" fill="#fff" stroke="#1a86ff" stroke-width="2.5"/>
    <text x="540" y="205" font-size="18" font-weight="700" fill="#0d1b2a" text-anchor="middle">Reverse proxy / load balancer</text>
    <text x="540" y="232" font-size="13" fill="#1a86ff" text-anchor="middle">1) session affinity ON (sticky cookie)</text>
    <text x="540" y="254" font-size="13" fill="#1a86ff" text-anchor="middle">2) WebSocket upgrade forwarded</text>
    <text x="540" y="276" font-size="12" fill="#5a6b7d" text-anchor="middle">probes GET /HealthCheck.json on every node</text>
  </g>

  <!-- nodes -->
  <g>
    <rect x="860" y="90" width="210" height="120" rx="12" fill="#fff" stroke="#1fae5a" stroke-width="2.5"/>
    <text x="965" y="120" font-size="17" font-weight="700" fill="#0d1b2a" text-anchor="middle">App node A :5112</text>
    <text x="965" y="145" font-size="12" fill="#1fae5a" text-anchor="middle" font-weight="700">Healthy · HTTP 200</text>
    <rect x="878" y="158" width="174" height="36" rx="6" fill="#f0fbf4" stroke="#b9e6c8"/>
    <text x="965" y="181" font-size="12" fill="#0d1b2a" text-anchor="middle" font-family="Consolas, monospace">session a9f3c2 · L. Romero</text>

    <rect x="860" y="250" width="210" height="120" rx="12" fill="#fff" stroke="#7d5ae0" stroke-width="2.5"/>
    <text x="965" y="280" font-size="17" font-weight="700" fill="#0d1b2a" text-anchor="middle">App node B :5112</text>
    <text x="965" y="305" font-size="12" fill="#1fae5a" text-anchor="middle" font-weight="700">Healthy · HTTP 200</text>
    <rect x="878" y="318" width="174" height="36" rx="6" fill="#f3effd" stroke="#d9cdf7"/>
    <text x="965" y="341" font-size="12" fill="#0d1b2a" text-anchor="middle" font-family="Consolas, monospace">session d41b77 · M. Weber</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1fae5a"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d5ae0"/></marker>
  </defs>
  <line x1="220" y1="155" x2="398" y2="205" stroke="#1fae5a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="220" y1="305" x2="398" y2="255" stroke="#7d5ae0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="680" y1="205" x2="856" y2="150" stroke="#1fae5a" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="680" y1="255" x2="856" y2="310" stroke="#7d5ae0" stroke-width="3" marker-end="url(#ap)"/>
  <text x="768" y="165" font-size="13" font-weight="700" fill="#1fae5a" text-anchor="middle">always → A</text>
  <text x="768" y="300" font-size="13" font-weight="700" fill="#7d5ae0" text-anchor="middle">always → B</text>

  <!-- footer -->
  <rect x="30" y="392" width="1040" height="34" rx="8" fill="#fff5e6" stroke="#e8a13c"/>
  <text x="550" y="414" font-size="13" fill="#7c4a00" text-anchor="middle">Round-robin without affinity would send M. Weber's next click to node A — where session d41b77 does not exist. Server-held state is why affinity is mandatory.</text>
</svg>
