<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a4d63"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f8a4c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d67a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#f5f7fa"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0d1b2a">Approval dialog workflow — Module 6 · TicketOps Console</text>
  <text x="24" y="56" fill="#3a4d63">The dialog gathers intent; the service executes the transaction. Five exits, one of them changes the world.</text>

  <!-- Layer bands -->
  <rect x="24" y="80" width="1132" height="150" rx="10" fill="#ffffff" stroke="#d9e1ea"/>
  <text x="40" y="104" font-size="12" font-weight="700" fill="#1a86ff" letter-spacing="1">UI · Views/WorkOrderQueue + Dialogs/ApprovalDialog</text>
  <rect x="24" y="250" width="1132" height="210" rx="10" fill="#ffffff" stroke="#d9e1ea"/>
  <text x="40" y="274" font-size="12" font-weight="700" fill="#1f8a4c" letter-spacing="1">SERVICE + DOMAIN · Services/ApprovalService, Domain/WorkOrder</text>
  <rect x="24" y="480" width="1132" height="150" rx="10" fill="#ffffff" stroke="#d9e1ea"/>
  <text x="40" y="504" font-size="12" font-weight="700" fill="#6a4fb3" letter-spacing="1">DATA · Data/InMemoryWorkOrderRepository — one transaction</text>

  <!-- UI: screen -->
  <rect x="40" y="120" width="200" height="90" rx="8" fill="#eaf3ff" stroke="#1a86ff" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" font-weight="700" fill="#0d1b2a">Work Orders screen</text>
  <text x="140" y="168" text-anchor="middle" fill="#3a4d63">WO-2002 selected</text>
  <text x="140" y="188" text-anchor="middle" fill="#3a4d63">click “Approve / Reject…”</text>

  <!-- UI: dialog -->
  <rect x="300" y="112" width="290" height="106" rx="8" fill="#ffffff" stroke="#1a86ff" stroke-width="2"/>
  <rect x="300" y="112" width="290" height="26" rx="8" fill="#1a86ff"/>
  <text x="445" y="130" text-anchor="middle" font-weight="700" fill="#ffffff">ApprovalDialog (modal)</text>
  <text x="445" y="158" text-anchor="middle" fill="#3a4d63">Decision: ◉ Approve  ○ Reject</text>
  <text x="445" y="178" text-anchor="middle" fill="#3a4d63">Comments (required when rejecting)</text>
  <text x="445" y="200" text-anchor="middle" font-weight="700" fill="#3a4d63">[ Cancel ]   [ Confirm ]   ✕</text>
  <line x1="240" y1="165" x2="300" y2="165" stroke="#3a4d63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#3a4d63">await</text>
  <text x="270" y="181" text-anchor="middle" font-size="11" fill="#3a4d63">ShowDialogAsync()</text>

  <!-- UI: gate -->
  <rect x="660" y="120" width="220" height="90" rx="8" fill="#eaf3ff" stroke="#1a86ff" stroke-width="1.5"/>
  <text x="770" y="146" text-anchor="middle" font-weight="700" fill="#0d1b2a">The caller's one gate</text>
  <text x="770" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3a4d63">outcome == DialogResult.OK</text>
  <text x="770" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3a4d63">&amp;&amp; dialog.Result.Confirmed</text>
  <line x1="590" y1="150" x2="660" y2="150" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="625" y="142" text-anchor="middle" font-size="11" fill="#1f8a4c">Confirm ✓ valid</text>

  <!-- UI: unchanged exits -->
  <rect x="940" y="120" width="200" height="90" rx="8" fill="#fff8ee" stroke="#d67a00" stroke-width="1.5"/>
  <text x="1040" y="146" text-anchor="middle" font-weight="700" fill="#0d1b2a">return — unchanged</text>
  <text x="1040" y="166" text-anchor="middle" fill="#3a4d63">Cancel · ✕ · never confirmed</text>
  <text x="1040" y="186" text-anchor="middle" fill="#3a4d63">no service call, no mutation</text>
  <line x1="880" y1="165" x2="940" y2="165" stroke="#d67a00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="910" y="157" text-anchor="middle" font-size="11" fill="#d67a00">false</text>

  <!-- validation loop inside the dialog -->
  <path d="M 590 200 C 625 200, 625 228, 590 228 L 450 228 C 425 228, 425 218, 445 218" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="445" y="244" text-anchor="middle" font-size="11" fill="#c0392b">Reject + empty comments → DialogResult.None, dialog stays open, nothing produced</text>

  <!-- SERVICE -->
  <line x1="770" y1="210" x2="770" y2="292" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="850" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1f8a4c">ApplyAsync(2002, result)</text>

  <rect x="40" y="292" width="250" height="60" rx="8" fill="#eefaf2" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="165" y="316" text-anchor="middle" font-weight="700" fill="#0d1b2a">Gate 1 · Confirmed?</text>
  <text x="165" y="338" text-anchor="middle" fill="#3a4d63">unconfirmed → Fail, nothing applied</text>

  <rect x="320" y="292" width="250" height="60" rx="8" fill="#eefaf2" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="445" y="316" text-anchor="middle" font-weight="700" fill="#0d1b2a">→ ApprovalCommand</text>
  <text x="445" y="338" text-anchor="middle" fill="#3a4d63">+ DecidedBy (session), DecidedAtUtc</text>

  <rect x="600" y="292" width="250" height="60" rx="8" fill="#eefaf2" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="725" y="316" text-anchor="middle" font-weight="700" fill="#0d1b2a">Gate 2 · comments rule</text>
  <text x="725" y="338" text-anchor="middle" fill="#3a4d63">Reject without comments → Fail</text>

  <rect x="880" y="292" width="260" height="60" rx="8" fill="#eefaf2" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="1010" y="316" text-anchor="middle" font-weight="700" fill="#0d1b2a">Gate 3 · WorkOrder.CanDecide</text>
  <text x="1010" y="338" text-anchor="middle" fill="#3a4d63">already decided → Fail (reason)</text>

  <line x1="290" y1="322" x2="320" y2="322" stroke="#1f8a4c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="570" y1="322" x2="600" y2="322" stroke="#1f8a4c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="850" y1="322" x2="880" y2="322" stroke="#1f8a4c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="320" y="380" width="530" height="60" rx="8" fill="#eefaf2" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="585" y="404" text-anchor="middle" font-weight="700" fill="#0d1b2a">WorkOrder.Decide(action, comments, decidedBy, decidedAtUtc)</text>
  <text x="585" y="426" text-anchor="middle" fill="#3a4d63">status → Approved / Rejected — in memory only until the commit</text>
  <path d="M 1010 352 L 1010 410 L 850 410" fill="none" stroke="#1f8a4c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="1040" y="385" font-size="11" fill="#1f8a4c">pending ✓</text>

  <!-- Fail results back to UI -->
  <rect x="40" y="380" width="250" height="60" rx="8" fill="#fff8ee" stroke="#d67a00" stroke-width="1.5"/>
  <text x="165" y="404" text-anchor="middle" font-weight="700" fill="#0d1b2a">OperationResult.Fail(message)</text>
  <text x="165" y="426" text-anchor="middle" fill="#3a4d63">→ orange banner, “not applied”</text>
  <line x1="165" y1="352" x2="165" y2="380" stroke="#d67a00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M 725 352 L 725 366 L 300 366 L 300 410 L 290 410" fill="none" stroke="#d67a00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M 1110 352 L 1110 366 L 740 366" fill="none" stroke="#d67a00" stroke-width="1.5"/>
  <text x="1125" y="372" font-size="11" fill="#d67a00">refused</text>

  <!-- DATA -->
  <line x1="585" y1="440" x2="585" y2="522" stroke="#6a4fb3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6a4fb3">BeginTransaction()</text>

  <rect x="120" y="522" width="240" height="80" rx="8" fill="#f3efff" stroke="#6a4fb3" stroke-width="1.5"/>
  <text x="240" y="548" text-anchor="middle" font-weight="700" fill="#0d1b2a">1 · UPDATE WorkOrders</text>
  <text x="240" y="568" text-anchor="middle" fill="#3a4d63">SET Status = 'Approved'</text>
  <text x="240" y="588" text-anchor="middle" fill="#3a4d63">WHERE Id = 2002</text>

  <rect x="400" y="522" width="240" height="80" rx="8" fill="#f3efff" stroke="#6a4fb3" stroke-width="1.5"/>
  <text x="520" y="548" text-anchor="middle" font-weight="700" fill="#0d1b2a">2 · INSERT ApprovalAudit</text>
  <text x="520" y="568" text-anchor="middle" fill="#3a4d63">the command is the audit row</text>
  <text x="520" y="588" text-anchor="middle" fill="#c0392b" font-size="12">✖ outage drill throws here</text>

  <rect x="680" y="522" width="240" height="80" rx="8" fill="#f3efff" stroke="#6a4fb3" stroke-width="1.5"/>
  <text x="800" y="548" text-anchor="middle" font-weight="700" fill="#0d1b2a">3 · INSERT Outbox</text>
  <text x="800" y="568" text-anchor="middle" fill="#3a4d63">notify the requester</text>
  <text x="800" y="588" text-anchor="middle" fill="#3a4d63">(T. Nguyen)</text>

  <line x1="360" y1="562" x2="400" y2="562" stroke="#6a4fb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="562" x2="680" y2="562" stroke="#6a4fb3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="960" y="522" width="180" height="80" rx="8" fill="#eefaf2" stroke="#1f8a4c" stroke-width="2"/>
  <text x="1050" y="548" text-anchor="middle" font-weight="700" fill="#0d1b2a">Commit</text>
  <text x="1050" y="568" text-anchor="middle" fill="#3a4d63">3 of 3 applied</text>
  <text x="1050" y="588" text-anchor="middle" fill="#3a4d63">atomically</text>
  <line x1="920" y1="562" x2="960" y2="562" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- outcomes -->
  <rect x="24" y="650" width="540" height="90" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="40" y="676" font-weight="700" fill="#c0392b">Error path · DataOutageException during the commit</text>
  <text x="40" y="698" fill="#3a4d63">Working copy discarded: 0 of 3 statements reach the live store. The handler's catch logs the</text>
  <text x="40" y="718" fill="#3a4d63">exception (sql01:1433 stays in the trace) and shows Strings.ActionFailed. Recover → confirm again → commit.</text>
  <path d="M 520 602 L 520 620 L 300 620 L 300 650" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="616" y="650" width="540" height="90" rx="10" fill="#eefaf2" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="632" y="676" font-weight="700" fill="#1f8a4c">Success path · OperationResult.Ok</text>
  <text x="632" y="698" fill="#3a4d63">“Work order WO-2002 approved.” → green status, the grid refreshes, WO-2002 shows Approved by</text>
  <text x="632" y="718" fill="#3a4d63">approver@ticketops with the comments. Status, audit and notification changed together.</text>
  <path d="M 1050 602 L 1050 620 L 886 620 L 886 650" fill="none" stroke="#1f8a4c" stroke-width="2" marker-end="url(#arrowGreen)"/>
</svg>
