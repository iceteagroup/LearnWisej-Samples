<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a4d63"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0d1b2a">Safe save pipeline — TicketOps Work Order editor (Module 5)</text>
  <text x="24" y="56" fill="#5a6b7d">Validate → rules &amp; authorize → persist atomically → confirm. Any failed step exits early; nothing is written unless every step passes.</text>

  <!-- lane backgrounds -->
  <rect x="24" y="80" width="1132" height="120" rx="10" fill="#eaf3ff" stroke="#c5ddff"/>
  <text x="36" y="100" font-size="12" font-weight="700" fill="#0b6ae6" letter-spacing="1">UI · WorkOrderEditor (display + input only)</text>
  <rect x="24" y="216" width="1132" height="150" rx="10" fill="#eefaf2" stroke="#cde8d6"/>
  <text x="36" y="236" font-size="12" font-weight="700" fill="#1f8a4c" letter-spacing="1">SERVICE · WorkOrderService.SaveAsync (the gate) — DOMAIN · WorkOrderValidator, WorkOrderRules</text>
  <rect x="24" y="382" width="1132" height="100" rx="10" fill="#f4effc" stroke="#ddd0f5"/>
  <text x="36" y="402" font-size="12" font-weight="700" fill="#6b3fc0" letter-spacing="1">DATA · IWorkOrderRepository / IWorkOrderTransaction (in-memory here, SQL tomorrow)</text>

  <!-- UI lane boxes -->
  <g>
    <rect x="44" y="116" width="200" height="66" rx="8" fill="#fff" stroke="#1a86ff" stroke-width="1.5"/>
    <text x="144" y="142" text-anchor="middle" font-weight="700" fill="#0d1b2a">1–3 · Collect + Map</text>
    <text x="144" y="162" text-anchor="middle" font-size="12" fill="#3a4d63">BuildSaveCommandFromEditor()</text>
    <text x="144" y="176" text-anchor="middle" font-size="11" fill="#5a6b7d">→ SaveWorkOrderCommand (immutable)</text>

    <rect x="284" y="116" width="200" height="66" rx="8" fill="#fff" stroke="#1a86ff" stroke-width="1.5"/>
    <text x="384" y="142" text-anchor="middle" font-weight="700" fill="#0d1b2a">2 · UX pre-check</text>
    <text x="384" y="162" text-anchor="middle" font-size="12" fill="#3a4d63">_validator.Validate(command)</text>
    <text x="384" y="176" text-anchor="middle" font-size="11" fill="#5a6b7d">same rules, decides nothing</text>

    <rect x="740" y="116" width="200" height="66" rx="8" fill="#fff" stroke="#1a86ff" stroke-width="1.5"/>
    <text x="840" y="142" text-anchor="middle" font-weight="700" fill="#0d1b2a">7 · Refresh + show</text>
    <text x="840" y="162" text-anchor="middle" font-size="12" fill="#3a4d63">ShowSaveResult · RefreshGrid</text>
    <text x="840" y="176" text-anchor="middle" font-size="11" fill="#5a6b7d">"Work order #2002 saved." · v2</text>

    <rect x="960" y="116" width="196" height="66" rx="8" fill="#fdf3f3" stroke="#c0392b" stroke-width="1.5"/>
    <text x="1058" y="142" text-anchor="middle" font-weight="700" fill="#9c2f2f">Error UX</text>
    <text x="1058" y="160" text-anchor="middle" font-size="11" fill="#7c2a2a">ErrorProvider glyphs + summary panel</text>
    <text x="1058" y="175" text-anchor="middle" font-size="11" fill="#7c2a2a">or Strings.SaveFailed (edits kept)</text>
  </g>

  <!-- Service lane boxes -->
  <g>
    <rect x="44" y="256" width="220" height="90" rx="8" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="154" y="282" text-anchor="middle" font-weight="700" fill="#0d1b2a">4 · Validate (server)</text>
    <text x="154" y="302" text-anchor="middle" font-size="12" fill="#3a4d63">WorkOrderValidator.Validate</text>
    <text x="154" y="318" text-anchor="middle" font-size="11" fill="#5a6b7d">required · range · cross-field · transition</text>
    <text x="154" y="334" text-anchor="middle" font-size="11" fill="#9c2f2f">✕ SaveResult.Invalid("validate")</text>

    <rect x="304" y="256" width="240" height="90" rx="8" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="424" y="282" text-anchor="middle" font-weight="700" fill="#0d1b2a">5 · Rules + Authorize</text>
    <text x="424" y="302" text-anchor="middle" font-size="12" fill="#3a4d63">WorkOrderRules.Check(stored, cmd, session.Role)</text>
    <text x="424" y="318" text-anchor="middle" font-size="11" fill="#5a6b7d">closed freeze · stored-status transition · $2,500 role</text>
    <text x="424" y="334" text-anchor="middle" font-size="11" fill="#9c2f2f">✕ SaveResult.Invalid("rules")</text>

    <rect x="584" y="256" width="240" height="90" rx="8" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="704" y="282" text-anchor="middle" font-weight="700" fill="#0d1b2a">6 · Persist (one transaction)</text>
    <text x="704" y="302" text-anchor="middle" font-size="12" fill="#3a4d63">tx.Upsert · tx.Audit · await tx.CommitAsync()</text>
    <text x="704" y="318" text-anchor="middle" font-size="11" fill="#5a6b7d">the commit is the single moment "it happened"</text>
    <text x="704" y="334" text-anchor="middle" font-size="11" fill="#9c2f2f">✕ throws → Dispose rolls back → handler catch</text>

    <rect x="864" y="256" width="272" height="90" rx="8" fill="#fff" stroke="#1f8a4c" stroke-width="1.5"/>
    <text x="1000" y="282" text-anchor="middle" font-weight="700" fill="#0d1b2a">8 · Confirm + Log</text>
    <text x="1000" y="302" text-anchor="middle" font-size="12" fill="#3a4d63">SaveResult.Ok(saved) — only after commit</text>
    <text x="1000" y="318" text-anchor="middle" font-size="11" fill="#5a6b7d">every step wrote to ILog; the audit row is in the tx</text>
    <text x="1000" y="334" text-anchor="middle" font-size="11" fill="#1f8a4c">✓ the screen may now say "saved"</text>
  </g>

  <!-- Data lane boxes -->
  <g>
    <rect x="304" y="420" width="240" height="48" rx="8" fill="#fff" stroke="#6b3fc0" stroke-width="1.5"/>
    <text x="424" y="440" text-anchor="middle" font-weight="700" fill="#0d1b2a">FindAsync(id)</text>
    <text x="424" y="458" text-anchor="middle" font-size="11" fill="#5a6b7d">the STORED status and RowVersion</text>

    <rect x="584" y="420" width="240" height="48" rx="8" fill="#fff" stroke="#6b3fc0" stroke-width="1.5"/>
    <text x="704" y="440" text-anchor="middle" font-weight="700" fill="#0d1b2a">BeginTransaction → Commit</text>
    <text x="704" y="458" text-anchor="middle" font-size="11" fill="#5a6b7d">staged rows invisible until commit; outage → rollback</text>
  </g>

  <!-- flow arrows -->
  <line x1="244" y1="149" x2="284" y2="149" stroke="#3a4d63" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 384 182 L 384 200 L 154 200 L 154 256" fill="none" stroke="#3a4d63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="196" font-size="11" fill="#3a4d63">valid → IWorkOrderService.SaveAsync(command, session)</text>
  <line x1="264" y1="301" x2="304" y2="301" stroke="#3a4d63" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="544" y1="301" x2="584" y2="301" stroke="#3a4d63" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="824" y1="301" x2="864" y2="301" stroke="#3a4d63" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1000 256 L 1000 230 L 840 230 L 840 182" fill="none" stroke="#3a4d63" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="846" y="222" font-size="11" fill="#3a4d63">SaveResult.Ok → UI</text>
  <line x1="424" y1="346" x2="424" y2="420" stroke="#6b3fc0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="346" x2="760" y2="420" stroke="#6b3fc0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- early exits (dashed red): every one lands on the Error UX box, none passes through another box -->
  <path d="M 384 116 L 384 108 L 1058 108 L 1058 116" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="500" y="104" font-size="11" fill="#c0392b">pre-check failed → glyphs + summary panel, nothing sent to the service</text>
  <path d="M 154 346 L 154 356 L 1146 356 L 1146 182" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="180" y="352" font-size="11" fill="#c0392b">Invalid result (validate / rules): every error collected, no transaction opened</text>
  <path d="M 704 346 L 704 374 L 1152 374 L 1152 182" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="836" y="370" font-size="11" fill="#c0392b">DataOutageException: rolled back, logged, safe message</text>

  <!-- footer -->
  <text x="24" y="512" font-size="12" fill="#3a4d63">Bypass: a crafted SaveWorkOrderCommand enters at step 4 — it skips the pre-check, never the server. The role comes from SessionContext, not from the command.</text>
  <text x="24" y="534" font-size="12" fill="#3a4d63">RowVersion only changes on commit: after a failed persist the editor re-reads the row and logs "v1 … unchanged, nothing partial".</text>
</svg>
