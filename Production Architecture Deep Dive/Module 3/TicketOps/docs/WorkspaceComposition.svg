<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .t  { fill: #0d1b2a; }
      .m  { fill: #5a6b7d; font-size: 12px; }
      .h  { fill: #0d1b2a; font-weight: 700; font-size: 15px; }
      .k  { fill: #1a86ff; font-weight: 700; font-size: 11px; letter-spacing: .04em; }
      .e  { fill: #1f8a4c; font-weight: 700; font-size: 11px; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 11.5px; fill: #3a4d63; }
      .box { fill: #ffffff; stroke: #c6d2de; stroke-width: 1.2; }
      .dock { fill: #eaf3ff; stroke: #1a86ff; stroke-width: 1.2; }
      .flex { fill: #e9f8ef; stroke: #1f8a4c; stroke-width: 1.2; }
      .table { fill: #fff4e5; stroke: #d67a00; stroke-width: 1.2; }
      .flow { fill: #f3ecff; stroke: #7c4dff; stroke-width: 1.2; }
      .tab { fill: #f6f9fc; stroke: #6a7d92; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .uc { fill: #ffffff; stroke: #c0392b; stroke-width: 1.4; }
    </style>
  </defs>

  <text x="24" y="34" class="h" font-size="20">TicketWorkspace — composition: one engine per container, the same panels in three arrangements</text>
  <text x="24" y="54" class="m">Legend:</text>
  <rect x="84" y="43" width="14" height="12" class="dock"/><text x="104" y="54" class="m">Dock / Anchor</text>
  <rect x="200" y="43" width="14" height="12" class="flex"/><text x="220" y="54" class="m">FlexLayoutPanel (fill weights)</text>
  <rect x="400" y="43" width="14" height="12" class="table"/><text x="420" y="54" class="m">TableLayoutPanel (35 % / 65 %)</text>
  <rect x="600" y="43" width="14" height="12" class="flow"/><text x="620" y="54" class="m">FlowLayoutPanel (wraps)</text>
  <rect x="770" y="43" width="14" height="12" class="tab"/><text x="790" y="54" class="m">TabControl (tablet / phone)</text>
  <rect x="960" y="43" width="14" height="12" class="uc"/><text x="980" y="54" class="m">reusable UserControl</text>

  <!-- ===================== DESKTOP ===================== -->
  <text x="24" y="92" class="k">DESKTOP  ≥ 1025 px · ShowAllPanels()</text>
  <rect x="24" y="100" width="560" height="330" class="dock" rx="4"/>
  <text x="32" y="116" class="mono">TicketWorkspace : UserControl — outer shell = Dock</text>

  <!-- header -->
  <rect x="32" y="122" width="544" height="26" class="dock"/>
  <text x="40" y="139" class="mono">pnlHeader  Dock.Top 36 · lblTitle "TicketOps — Ticket Workspace" · btnBack hidden</text>
  <!-- toolbar -->
  <rect x="32" y="150" width="544" height="30" class="dock"/>
  <rect x="40" y="156" width="300" height="18" class="uc" rx="3"/>
  <text x="46" y="169" class="mono">searchTickets : SearchBar  (Anchor L+R)</text>
  <rect x="470" y="156" width="98" height="18" class="box" rx="3"/>
  <text x="478" y="169" class="mono">btnNewTicket</text>
  <text x="350" y="169" class="mono">pnlToolbar Dock.Top 52</text>
  <!-- nav -->
  <rect x="32" y="182" width="96" height="220" class="dock"/>
  <text x="38" y="198" class="mono">pnlNavigation</text>
  <text x="38" y="212" class="mono">Dock.Left 150</text>
  <text x="38" y="236" class="mono">▦ Dashboard</text>
  <text x="38" y="254" class="mono">◳ Tickets</text>
  <text x="38" y="272" class="mono">▤ Reports</text>
  <text x="38" y="290" class="mono">⚙ Settings</text>
  <text x="38" y="316" class="m">items Dock.Top,</text>
  <text x="38" y="330" class="m">added bottom-up</text>
  <!-- body flex -->
  <rect x="132" y="182" width="444" height="220" class="flex"/>
  <text x="138" y="196" class="mono">flexBody : FlexLayoutPanel Horizontal · Dock.Fill · Spacing 12</text>
  <!-- list -->
  <rect x="140" y="202" width="250" height="192" class="box"/>
  <text x="146" y="216" class="mono">pnlList  weight 3</text>
  <rect x="146" y="222" width="238" height="30" class="flow"/>
  <text x="150" y="235" class="mono">flowChips  Open High Mine Today</text>
  <text x="150" y="247" class="mono">Unassigned Escalated  (wrap)</text>
  <rect x="146" y="256" width="238" height="132" class="box"/>
  <text x="150" y="270" class="mono">gridTickets  Dock.Fill</text>
  <text x="150" y="284" class="mono">Id · Title · Priority · Assignee · Status</text>
  <line x1="146" y1="290" x2="384" y2="290" stroke="#d9e1ea"/>
  <text x="150" y="304" class="m">1001 Login page returns 500 error</text>
  <text x="150" y="318" class="m">1005 Password reset email delayed</text>
  <text x="150" y="332" class="m">1003 Dashboard slow on Safari</text>
  <text x="150" y="346" class="m">…</text>
  <!-- side flex -->
  <rect x="398" y="202" width="170" height="192" class="flex"/>
  <text x="404" y="215" class="mono">pnlSide  weight 2</text>
  <text x="404" y="227" class="mono">flexSide Vertical</text>
  <rect x="404" y="232" width="158" height="96" class="table"/>
  <text x="408" y="245" class="mono">pnlDetail  weight 3</text>
  <text x="408" y="258" class="mono">tableDetail 35% | 65%</text>
  <text x="408" y="271" class="m">Title     [__________]</text>
  <text x="408" y="284" class="m">Priority  [Medium  ▾]</text>
  <text x="408" y="297" class="m">Assignee  [S. Patel ▾]</text>
  <text x="408" y="310" class="m">Notes     [ fills   ]</text>
  <rect x="470" y="314" width="88" height="11" class="flow"/>
  <text x="474" y="323" class="mono" font-size="9px">flow RtL: Save Close</text>
  <rect x="404" y="334" width="158" height="56" class="box"/>
  <text x="408" y="347" class="mono">pnlActivity  weight 2</text>
  <rect x="408" y="351" width="150" height="12" class="uc" rx="2"/>
  <text x="412" y="361" class="mono" font-size="9.5px">searchActivity : SearchBar</text>
  <text x="408" y="376" class="m">● S. Patel commented on #1003 — 2m</text>
  <text x="408" y="387" class="m">● #1005 escalated to High — 3h</text>
  <!-- status -->
  <rect x="32" y="406" width="544" height="20" class="dock"/>
  <text x="40" y="420" class="mono">lblStatus  Dock.Bottom 26 · "Active profile: Desktop"</text>

  <!-- ===================== TABLET ===================== -->
  <text x="616" y="92" class="k">TABLET  601–1024 px · CollapseActivityToTab()</text>
  <rect x="616" y="100" width="330" height="330" class="dock" rx="4"/>
  <rect x="624" y="122" width="314" height="26" class="dock"/>
  <text x="632" y="139" class="mono">pnlHeader · btnBack hidden</text>
  <rect x="624" y="150" width="314" height="30" class="dock"/>
  <rect x="632" y="156" width="190" height="18" class="uc" rx="3"/>
  <text x="638" y="169" class="mono">searchTickets</text>
  <rect x="846" y="156" width="84" height="18" class="box" rx="3"/>
  <text x="852" y="169" class="mono">+ New</text>
  <rect x="624" y="182" width="34" height="220" class="dock"/>
  <text x="630" y="200" class="mono">▦</text><text x="630" y="218" class="mono">◳</text><text x="630" y="236" class="mono">▤</text><text x="630" y="254" class="mono">⚙</text>
  <text x="628" y="392" class="mono" font-size="9px">56 px</text>
  <rect x="662" y="182" width="276" height="220" class="flex"/>
  <text x="668" y="196" class="mono">flexBody · weights 1 : 1</text>
  <rect x="670" y="202" width="128" height="192" class="box"/>
  <text x="676" y="215" class="mono">pnlList</text>
  <rect x="676" y="220" width="116" height="40" class="flow"/>
  <text x="680" y="232" class="mono" font-size="9.5px">Open High Mine</text>
  <text x="680" y="243" class="mono" font-size="9.5px">Today Unassigned</text>
  <text x="680" y="254" class="mono" font-size="9.5px">Escalated  (wrapped)</text>
  <rect x="676" y="264" width="116" height="124" class="box"/>
  <text x="680" y="277" class="mono" font-size="9.5px">Id · Title · Priority · Status</text>
  <text x="680" y="290" class="m" font-size="10px">Assignee hidden</text>
  <text x="680" y="304" class="m" font-size="10px">(colAssignee.Visible)</text>
  <rect x="806" y="202" width="124" height="192" class="tab"/>
  <text x="812" y="215" class="mono">tabActivity</text>
  <rect x="812" y="220" width="52" height="14" class="box"/><text x="815" y="231" class="mono" font-size="9.5px">Details</text>
  <rect x="866" y="220" width="56" height="14" class="tab"/><text x="869" y="231" class="mono" font-size="9.5px">Activity</text>
  <rect x="812" y="236" width="112" height="150" class="table"/>
  <text x="816" y="249" class="mono" font-size="9.5px">pnlDetail (moved)</text>
  <text x="816" y="262" class="mono" font-size="9.5px">pnlDetail.Parent =</text>
  <text x="816" y="274" class="mono" font-size="9.5px">  tabPageDetails</text>
  <text x="816" y="292" class="m" font-size="10px">same instance:</text>
  <text x="816" y="304" class="m" font-size="10px">draft text intact</text>
  <rect x="624" y="406" width="314" height="20" class="dock"/>
  <text x="632" y="420" class="mono">"Active profile: Tablet"</text>

  <!-- ===================== PHONE ===================== -->
  <text x="976" y="92" class="k">PHONE  ≤ 600 px · ShowSingleTaskView()</text>
  <!-- list page -->
  <rect x="976" y="100" width="100" height="330" class="dock" rx="4"/>
  <rect x="982" y="122" width="88" height="26" class="dock"/>
  <text x="986" y="139" class="mono" font-size="10px">Tickets</text>
  <text x="986" y="162" class="m" font-size="9.5px">toolbar hidden</text>
  <text x="986" y="174" class="m" font-size="9.5px">nav hidden</text>
  <rect x="982" y="180" width="88" height="220" class="flex"/>
  <rect x="986" y="186" width="80" height="208" class="box"/>
  <rect x="990" y="190" width="72" height="42" class="flow"/>
  <text x="993" y="201" class="mono" font-size="8.5px">Open High</text>
  <text x="993" y="212" class="mono" font-size="8.5px">Mine Today</text>
  <text x="993" y="223" class="mono" font-size="8.5px">Unassigned…</text>
  <text x="990" y="248" class="mono" font-size="8.5px">Id Title Prio</text>
  <text x="990" y="262" class="m" font-size="9px">1001 Login…</text>
  <text x="990" y="276" class="m" font-size="9px">1005 Passw…</text>
  <text x="990" y="290" class="m" font-size="9px">1003 Dashb…</text>
  <text x="990" y="316" class="m" font-size="9px">tap a row →</text>
  <rect x="982" y="406" width="88" height="20" class="dock"/>
  <text x="986" y="420" class="mono" font-size="9px">profile: Phone</text>
  <text x="978" y="446" class="m" font-size="11px">list page (pnlSide hidden)</text>
  <!-- task page -->
  <rect x="1090" y="100" width="100" height="330" class="dock" rx="4"/>
  <rect x="1096" y="122" width="88" height="26" class="dock"/>
  <rect x="1098" y="126" width="30" height="18" class="box" rx="2"/>
  <text x="1100" y="139" class="mono" font-size="9px">←Back</text>
  <text x="1132" y="139" class="mono" font-size="9px">#1003</text>
  <rect x="1096" y="180" width="88" height="220" class="tab"/>
  <rect x="1100" y="186" width="38" height="12" class="box"/><text x="1102" y="195" class="mono" font-size="8px">Details</text>
  <rect x="1140" y="186" width="40" height="12" class="tab"/><text x="1142" y="195" class="mono" font-size="8px">Activity</text>
  <rect x="1100" y="200" width="80" height="194" class="table"/>
  <text x="1104" y="213" class="mono" font-size="8.5px">pnlDetail</text>
  <text x="1104" y="226" class="m" font-size="9px">Title  [____]</text>
  <text x="1104" y="239" class="m" font-size="9px">Prio   [▾]</text>
  <text x="1104" y="252" class="m" font-size="9px">Assig  [▾]</text>
  <text x="1104" y="265" class="m" font-size="9px">Notes  [fill]</text>
  <text x="1104" y="380" class="m" font-size="9px">Close  Save</text>
  <rect x="1096" y="406" width="88" height="20" class="dock"/>
  <text x="1100" y="420" class="mono" font-size="9px">profile: Phone</text>
  <text x="1092" y="446" class="m" font-size="11px">task page (pnlList hidden)</text>

  <!-- ===================== CONTROL TREE ===================== -->
  <text x="24" y="490" class="h">Control tree (Designer) — engine of each container</text>
  <g class="mono">
    <text x="24" y="512">TicketWorkspace : UserControl ............................ Dock (Controls.Add order: flexBody, pnlNavigation, pnlToolbar, pnlHeader, lblStatus)</text>
    <text x="24" y="530">├─ pnlHeader (Top 36)  → btnBack (Left, phone only) · lblTitle (Fill)</text>
    <text x="24" y="548">├─ pnlToolbar (Top 52) → searchTickets : SearchBar (Anchor L+R) · btnNewTicket (Anchor R)</text>
    <text x="24" y="566">├─ pnlNavigation (Left 150 | 56 | hidden) → 4 × Label Dock.Top, added bottom-up</text>
    <text x="24" y="584">├─ flexBody : FlexLayoutPanel Horizontal (Fill) ......... weights 3 : 2 (desktop) · 1 : 1 (tablet, phone)</text>
    <text x="24" y="602">│   ├─ pnlList → flowChips : FlowLayoutPanel (Top, wraps) · gridTickets (Fill; colAssignee / colStatus.Visible per profile)</text>
    <text x="24" y="620">│   └─ pnlSide → flexSide : FlexLayoutPanel Vertical (desktop) ‖ tabActivity : TabControl (tablet, phone)</text>
    <text x="24" y="638">│         ├─ pnlDetail → lblDetailHead (Top) · tableDetail : TableLayoutPanel 35 % | 65 %, Notes row Percent 100, flowDetailButtons (RtL)</text>
    <text x="24" y="656">│         └─ pnlActivity → lblActivityHead (Top) · searchActivity : SearchBar (Top) · listActivity (Fill)</text>
    <text x="24" y="674">└─ lblStatus (Bottom 26) "Active profile: …"</text>
  </g>
  <text x="24" y="704" class="e">ApplyResponsiveProfile(name): switch → ShowAllPanels() | CollapseActivityToTab() | ShowSingleTaskView() | default: warn + ShowAllPanels()</text>
  <text x="24" y="722" class="m">MovePanelsToFlex() / MovePanelsToTabs() re-parent pnlDetail and pnlActivity — the same instances, so selection, draft text and the feed survive every switch.</text>
  <text x="24" y="740" class="m">Host: Views/MainPage (Page, Dock) — workspace card Fill · trace card Right (desktop) / Bottom (tablet) / hidden (phone) · bottom bar = FlowLayoutPanel of paths.</text>
</svg>
