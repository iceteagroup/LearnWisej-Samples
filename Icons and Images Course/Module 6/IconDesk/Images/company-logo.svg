<?xml version="1.0" encoding="utf-8"?>
<!-- The IconDesk project mark. Every path turns its own fill off and strokes with a literal
     colour, so Wisej.NET renders it exactly as drawn: the ?color= suffix and a theme switch both
     leave it alone. That is deliberate - a brand mark is artwork, not an icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 24 24">
  <path fill="none" stroke="#6b7c90" stroke-width="1.6" stroke-linejoin="round" d="M12 2.6 20.5 7v10L12 21.4 3.5 17V7Z"/>
  <path fill="none" stroke="#6b7c90" stroke-width="1.6" stroke-linejoin="round" d="M8 14.5 12 8l4 6.5"/>
  <path fill="none" stroke="#6b7c90" stroke-width="1.6" stroke-linejoin="round" d="M9.6 12.6h4.8"/>
</svg>
