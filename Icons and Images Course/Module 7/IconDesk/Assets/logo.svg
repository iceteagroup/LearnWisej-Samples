<?xml version="1.0" encoding="utf-8"?>
<!-- The IconDesk mark, embedded in the assembly. Two fills on purpose: Wisej.NET reads artwork
     with more than one meaningful fill as a picture and passes it through untouched, so the
     brand colours survive every theme. A single-fill version of this file would be repainted. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" fill="#eaf3ff" stroke="#1565d8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 15 L33 31 L15 31 Z" fill="#1565d8"/>
</svg>
